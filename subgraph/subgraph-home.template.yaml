specVersion: 0.0.4
description: Subgraph for the Bridge Monitoring System
repository: https://github.com/gnosischain/bridge-monitor-subgraph
schema:
  file: ./schema.graphql
dataSources:
  - name: HomeBridgeErcToNative
    kind: ethereum/contract
    network: {{network}} # gnosis | chiado
    source:
      address: '{{HomeBridgeErcToNative}}'
      abi: HomeBridgeErcToNative
      startBlock: {{startBlockHomeBridgeErcToNative}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - XDAITransaction
        - TransactionValidation
        - TransactionExecution
        - Validator
      abis:
        - name: HomeBridgeErcToNative
          file: ./abis/HomeBridgeErcToNative.json
      eventHandlers:
        - event: UserRequestForSignature(address,uint256)
          handler: handleUserRequestForSignature
        - event: SignedForUserRequest(indexed address,bytes32)
          handler: handleSignedForUserRequest
        - event: CollectedSignatures(address,bytes32,uint256)
          handler: handleCollectedSignatures
        - event: SignedForAffirmation(indexed address,bytes32)
          handler: handlerSignedForAffirmation
        - event: AffirmationCompleted(address,uint256,bytes32)
          handler: handlerAffirmationCompleted
      file: ./src/home-xdai.ts
  - name: XDAIBridgeValidators
    kind: ethereum/contract
    network: {{network}} # gnosis | chiado
    source:
      address: '{{XDAIBridgeValidators}}'
      abi: BridgeValidators
      startBlock: {{startBlockXDAIBridgeValidators}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Validator
      abis:
        - name: BridgeValidators
          file: ./abis/BridgeValidators.json
      eventHandlers:
        - event: ValidatorAdded(indexed address)
          handler: handlerValidatorAdded
        - event: ValidatorRemoved(indexed address)
          handler: handlerValidatorRemoved
      file: ./src/bridge-validators/xdai-validators.ts
  - name: AMBBridgeValidators
    kind: ethereum/contract
    network: {{network}} # gnosis | chiado
    source:
      address: '{{AMBBridgeValidators}}'
      abi: BridgeValidators
      startBlock: {{startBlockAMBBridgeValidators}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Validator
      abis:
        - name: BridgeValidators
          file: ./abis/BridgeValidators.json
      eventHandlers:
        - event: ValidatorAdded(indexed address)
          handler: handlerValidatorAdded
        - event: ValidatorRemoved(indexed address)
          handler: handlerValidatorRemoved
      file: ./src/bridge-validators/amb-validators.ts
  - name: OmniBridgeMediator
    kind: ethereum/contract
    network: {{network}} # gnosis | chiado
    source:
      address: '{{OmniBridgeHomeMediator}}'
      abi: OmniBridgeMediators
      startBlock: {{startBlockOmniBridgeHomeMediator}} # Should we use a specific start block?
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Transaction
        - OmniTransaction
      abis:
        - name: OmniBridgeMediators
          file: ./abis/OmniBridgeMediators.json
      eventHandlers:
        - event: TokensBridgingInitiated(indexed address,indexed address,uint256,indexed bytes32)
          handler: handlerTokensBridgingInitiated
        - event: TokensBridged(indexed address,indexed address,uint256,indexed bytes32)
          handler: handlerTokensBridged
      file: ./src/omnibridge-mediators.ts
  - name: HomeAMB
    kind: ethereum/contract
    network: {{network}} # gnosis | chiado
    source:
      address: '{{HomeAMB}}'
      abi: HomeAMB
      startBlock: {{startBlockHomeAMB}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Transaction
        - AMBTransaction
        - TransactionValidation
        - TransactionExecution
        - Validator
      abis:
        - name: HomeAMB
          file: ./abis/HomeAMB.json
      eventHandlers:
        - event: UserRequestForSignature(indexed bytes32,bytes)
          handler: handlerUserRequestForSignatureEvent
        - event: SignedForUserRequest(indexed address,bytes32)
          handler: handlerSignedForUserRequest
        - event: SignedForAffirmation(indexed address,bytes32)
          handler: handlerSignedForAffirmation
        - event: CollectedSignatures(address,bytes32,uint256)
          handler: handlerCollectedSignatures
        - event: AffirmationCompleted(indexed address,indexed address,indexed bytes32,bool)
          handler: handlerAffirmationCompleted
      file: ./src/home-amb.ts
