  #     file: ./src/bridge-validators/xdai-validators.ts
  - name: AMBBridgeValidators
    kind: ethereum/contract
    network: {{network}} # gnosis | chiado
    source:
      address: '{{AMBBridgeValidators}}'
      abi: BridgeValidators
      startBlock: {{startBlockAMBBridgeValidators}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Validator
      abis:
        - name: BridgeValidators
          file: ./abis/BridgeValidators.json
      eventHandlers:
        - event: ValidatorAdded(indexed address)
          handler: handlerValidatorAdded
        - event: ValidatorRemoved(indexed address)
          handler: handlerValidatorRemoved
      file: ./src/bridge-validators/amb-validators.ts
  - name: HomeAMB
    kind: ethereum/contract
    network: {{network}} # gnosis | chiado
    source:
      address: '{{HomeAMB}}'
      abi: HomeAMB
      startBlock: {{startBlockHomeAMB}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transaction
        - AMBTransaction
        - TransactionValidation
        - TransactionExecution
        - Validator
      abis:
        - name: HomeAMB
          file: ./abis/HomeAMB.json
      eventHandlers:
        - event: UserRequestForSignature(indexed bytes32,bytes)
          handler: handlerUserRequestForSignature
          receipt: true
        - event: SignedForUserRequest(indexed address,bytes32)
          handler: handlerSignedForUserRequest
        - event: SignedForAffirmation(indexed address,bytes32)
          handler: handlerSignedForAffirmation
          receipt: true
        - event: CollectedSignatures(address,bytes32,uint256)
          handler: handlerCollectedSignatures
        - event: AffirmationCompleted(indexed address,indexed address,indexed bytes32,bool)
          handler: handlerAffirmationCompleted
          receipt: true
      file: ./src/home-amb.ts
