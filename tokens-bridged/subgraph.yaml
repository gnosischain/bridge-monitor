specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ForeignOmnibridge
    network: mainnet
    source:
      address: "0x88ad09518695c6c3712AC10a214bE5109a655671"
      abi: ForeignOmnibridge
      startBlock: 10590093
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ProxyOwnershipTransferred
        - Upgraded
      abis:
        - name: ForeignOmnibridge
          file: ./abis/ForeignOmnibridge.json
      eventHandlers:
        - event: ProxyOwnershipTransferred(address,address)
          handler: handleProxyOwnershipTransferred
        - event: Upgraded(uint256,indexed address)
          handler: handleUpgraded
      file: ./src/foreign-omnibridge.ts
