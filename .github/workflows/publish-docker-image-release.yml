
name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  NODE_ENV: "production"

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_ACCESS_TOKEN_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN_SECRET }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: gnosischain/bridge-monitor
      
      - name: Get Latest Tag
        id: get_tag
        uses: actions-ecosystem/action-get-latest-tag@v1
        
      # - name: Create release
      #   if: ${{ success() }}
      #   uses: actions/create-release@v1.0.0
      #   with:
      #     tag_name: ${{ steps.get_tag.outputs.tag }}
      #     release_name: ${{ steps.get_tag.outputs.tag }}
      #     draft: false
      #     prerelease: false
      
      - name: Release - Build & Push Docker image
        if: ( github.ref == 'refs/tags/*' )
        uses: docker/build-push-action@v3
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: gnosischain/bridge-monitor:${{ steps.get_tag.outputs.tag }}
          platforms: |
            linux/amd64

      - name: PROD - Build & Push Docker image
        if: ( github.ref == 'refs/heads/master' )
        uses: docker/build-push-action@v3
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: gnosischain/bridge-monitor:latest
          platforms: |
            linux/amd64