name: Temporary Build Test - fix/xdai-token-linting

# Temporary workflow to test Docker builds for fix/xdai-token-linting branch
# Only builds locally, does NOT push to ECR
# DELETE THIS WORKFLOW after testing is complete

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/xdai-token-linting'
    steps:
      - name: Validate branch
        run: |
          if [ "${{ github.ref_name }}" != "fix/xdai-token-linting" ]; then
            echo "❌ This workflow only runs on fix/xdai-token-linting branch"
            exit 1
          fi
          echo "✅ Running on correct branch: fix/xdai-token-linting"

      - name: Git clone the repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2.9.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v3.3.1
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: 'bridge-explorer:test-${{ github.sha }}'
          platforms: |
            linux/amd64
          build-args: |
            "NEXT_PUBLIC_APP_NAME=GnosisBridgeMonitor"
            "NEXT_PUBLIC_DEFAULT_THEME=dark"
            "NEXT_PUBLIC_DEFAULT_CHAIN_ID=1"
            "NEXT_PUBLIC_COOKIES_WARNING_ENABLED=true"
            "NEXT_PUBLIC_POLLING_INTERVAL=10000"
            "NEXT_PUBLIC_RPC_MAINNET=${{ secrets.DEV_RPC_MAINNET }}"
            "NEXT_PUBLIC_RPC_GNOSIS=${{ secrets.DEV_RPC_GNOSIS }}"
            "NEXT_PUBLIC_WALLET_CONNECT_DAPP_URL=${{ secrets.WALLET_CONNECT_URL }}"
            "NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.WALLET_CONNECT_PROJECT_ID }}"
            "NEXT_PUBLIC_SUBGRAPH_ENVIRONMENT=development"
            "NEXT_PUBLIC_SUBGRAPH_ACCESS_ID=${{ secrets.GRAPH_ORG }}"
            "NEXT_PUBLIC_SUBGRAPH_CHAINS_RESOURCE_IDS=100:version/latest,1:version/latest"
            "NEXT_PUBLIC_ALCHEMY_API_KEY=${{ secrets.DEV_NEXT_PUBLIC_ALCHEMY_API_KEY }}"
            "NEXT_PUBLIC_ENVIO_INDEXER_URL=${{ secrets.DEV_ENVIO_INDEXER_URL }}"

      - name: Build Summary
        run: |
          echo "✅ Docker image built successfully!"
          echo "🎉 Container creation validated - no errors found"
          echo "📦 Image tag: bridge-explorer:test-${{ github.sha }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo ""
          echo "ℹ️  Note: Image was built locally only and NOT pushed to any registry"

