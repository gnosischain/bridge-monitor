name: Pull Request Linter
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

jobs:
  lint-pr:
    name: Lint pull request title
    runs-on: ubuntu-latest
    steps:
      - name: Lint pull request title
        uses: jef/conventional-commits-pr-action@2ee589f151916f92da5e2887c38d5fe6402e803c # v1.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
