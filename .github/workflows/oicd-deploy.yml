name: Deploy Bridge-Explorer

# Controls when the action will run. Invokes the workflow on push events
# on: 
#   workflow_dispatch:
on:
  push:
    branches:
      - develop
      - staging
env:
  AWS_REGION : "eu-central-1" 
  DEPLOYMENT_DEV: "bridge-explorer-develop"
  DEPLOYMENT_STG: "bridge-explorer"
  NAMESPACE: "bridges"

# Permission can be added at job level or workflow level    
permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout
jobs:
  Build_and_push_image_to_ECR:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4.0.0
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_ECR_ROLE }} 
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push DEVELOP docker image to Amazon ECR
        if: startsWith(github.ref, 'refs/heads/develop')
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        uses: docker/build-push-action@v3
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/bridge-explorer:develop"
          platforms: |
            linux/amd64
  
      - name: Build, tag, and push STAGING to Amazon ECR
        if: startsWith(github.ref, 'refs/heads/staging')
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.release_tag.outputs.tag }}
        uses: docker/build-push-action@v3
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: "${{ env.REGISTRY }}/bridge-explorer:staging"
          platforms: |
            linux/amd64

      - name: Get latest Release Tag
        if: ( github.ref == 'refs/heads/staging' )
        id: release_tag
        run: echo "tag=$(git describe --abbrev=0 --tags $(git rev-list --tags --max-count=1))" >> $GITHUB_OUTPUT

      # CREATE ${{ env.IMAGE_TAG }} + 1 for PROD
    
  Get_images_and_restart_deployments:
    needs: Build_and_push_image_to_ECR
    runs-on: ubuntu-latest
    steps:
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4.0.0
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_EKS_ROLE }} 
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Restart Bridge Explorer Deployment
        run: |
          kubectl config use-context arn:aws:eks:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:cluster/${{ secrets.AWS_EKS_CLUSTER }}
          if [ "${GITHUB_REF#refs/heads/}" = "develop" ]; then
            kubectl rollout restart deploy/${{ env.DEPLOYMENT_DEV }} -n ${{ env.NAMESPACE }}
          else
            kubectl rollout restart deploy/${{ env.DEPLOYMENT_STG }} -n ${{ env.NAMESPACE }}
          fi